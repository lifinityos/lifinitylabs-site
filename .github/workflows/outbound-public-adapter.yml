name: LifinityLabs Outbound Public Adapter

on:
  pull_request:
    paths:
      - 'package.json'
      - 'netlify/**'
      - 'test/**'
      - '.github/workflows/outbound-public-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'netlify/**'
      - 'test/**'
      - '.github/workflows/outbound-public-adapter.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm test
